version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════════
# AISS — Full Production Stack
# Usage:
#   cp .env.production.example .env   # fill in your values
#   docker-compose up -d
#   docker-compose logs -f aiss
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ── AISS Backend ────────────────────────────────────────────────────
  aiss:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: aiss/backend:2.0.0
    container_name: aiss_backend
    restart: unless-stopped
    env_file: .env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://aiss_user:${POSTGRES_PASSWORD}@postgres:5432/aiss_db
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
    ports:
      - "8000:8000"
    volumes:
      - aiss_data:/app/data
      - aiss_logs:/app/logs
      - aiss_rules:/app/rules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aiss_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 2G

  # ── Celery Worker ────────────────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: aiss/backend:2.0.0
    container_name: aiss_celery
    restart: unless-stopped
    env_file: .env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://aiss_user:${POSTGRES_PASSWORD}@postgres:5432/aiss_db
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
    command: >
      celery -A modules.celery_app worker
      --loglevel=warning
      --concurrency=4
      --queues=scan,ai,intel
    volumes:
      - aiss_data:/app/data
      - aiss_logs:/app/logs
    depends_on:
      - redis
      - postgres
    networks:
      - aiss_net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  # ── PostgreSQL ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aiss_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aiss_db
      POSTGRES_USER: aiss_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_IN_DOT_ENV}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aiss_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiss_user -d aiss_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Redis ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aiss_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-CHANGE_ME_IN_DOT_ENV}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    volumes:
      - redis_data:/data
    networks:
      - aiss_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Nginx Reverse Proxy + TLS ─────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: aiss_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/aiss.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
      - aiss_logs:/var/log/nginx
    depends_on:
      - aiss
    networks:
      - aiss_net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  aiss_data:
  aiss_logs:
  aiss_rules:
  postgres_data:
  redis_data:

networks:
  aiss_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
